<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>胡志明市散步繪本｜旅遊景點參考清單</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    :root {
      --bg-washi: #FFFCF6;
      --ink-gray: #3E3A39;
      --coral-pink: #F2A497;
      --yamabuki-yellow: #F6D27A;
      --mizu-blue: #A8D3E6;
      --wakatake-green: #B9DAA5;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-washi);
      color: var(--ink-gray);
      font-family: 'Huninn', 'jf-openhuninn', 'Zen Maru Gothic', 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* 3px 墨灰粗線框 & 大圓角 & 平塗無漸層 */
    .ehon-box {
      background-color: var(--bg-washi);
      border: 3px solid var(--ink-gray);
      border-radius: 24px;
      box-shadow: 4px 4px 0px var(--ink-gray);
    }

    .ehon-card {
      background-color: #FFFFFF;
      border: 3px solid var(--ink-gray);
      border-radius: 24px;
      box-shadow: 4px 4px 0px var(--ink-gray);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
    }

    .ehon-card:hover {
      transform: translateY(-3px);
      box-shadow: 6px 6px 0px var(--ink-gray);
    }

    .ehon-btn {
      border: 3px solid var(--ink-gray);
      border-radius: 9999px;
      box-shadow: 3px 3px 0px var(--ink-gray);
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease, background-color 0.15s ease;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      color: var(--ink-gray);
    }

    .ehon-btn:hover {
      transform: translateY(-2px);
      box-shadow: 4px 4px 0px var(--ink-gray);
    }

    .ehon-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--ink-gray);
    }

    .ehon-badge {
      border: 2.5px solid var(--ink-gray);
      border-radius: 9999px;
      padding: 3px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .bg-coral { background-color: var(--coral-pink); }
    .bg-yellow { background-color: var(--yamabuki-yellow); }
    .bg-blue { background-color: var(--mizu-blue); }
    .bg-green { background-color: var(--wakatake-green); }
    .bg-washi { background-color: var(--bg-washi); }

    /* 插圖輕輕動動畫 */
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(2deg); }
    }

    @keyframes sway-gentle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    @keyframes scoot-move {
      0%, 100% { transform: translateX(0px) translateY(0px); }
      25% { transform: translateX(2px) translateY(-2px); }
      75% { transform: translateX(-2px) translateY(-1px); }
    }

    .svg-float {
      animation: float-slow 3.6s ease-in-out infinite;
      transform-origin: center;
    }

    .svg-sway {
      animation: sway-gentle 3.2s ease-in-out infinite;
      transform-origin: bottom center;
    }

    .svg-scoot {
      animation: scoot-move 2.8s ease-in-out infinite;
    }

    /* 切換區域彈跳效果 */
    @keyframes bounce-switch {
      0% {
        opacity: 0;
        transform: scale(0.92) translateY(18px);
      }
      55% {
        opacity: 1;
        transform: scale(1.02) translateY(-5px);
      }
      80% {
        transform: scale(0.99) translateY(2px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .bounce-enter {
      animation: bounce-switch 0.48s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes tab-pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.08) translateY(-3px); }
      75% { transform: scale(0.97) translateY(1px); }
      100% { transform: scale(1); }
    }

    .tab-active-pop {
      animation: tab-pop 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 支援「減少動態效果」設定 */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .svg-float, .svg-sway, .svg-scoot, .bounce-enter, .tab-active-pop {
        animation: none !important;
        transform: none !important;
      }
      .ehon-card:hover, .ehon-btn:hover, .ehon-btn:active {
        transform: none !important;
      }
    }

    /* 手機優先隱藏捲軸但保留滑動 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- 頂端固定選單 -->
  <header class="sticky top-0 z-50 bg-[#FFFCF6] border-b-[3px] border-[#3E3A39] px-3 py-3">

      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-2">
          <!-- 越南斗笠手繪 SVG -->
          <svg class="w-8 h-8 svg-sway shrink-0" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M8 44L32 14L56 44H8Z" fill="#F6D27A" stroke="#3E3A39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M18 32L32 44L46 32" stroke="#3E3A39" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 44C20 51 44 51 44 44" stroke="#F2A497" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <div>
            <h1 class="text-lg sm:text-xl font-bold tracking-wide leading-tight">胡志明市散步繪本</h1>
            <p class="text-xs opacity-80">54 個精選地點・Google Maps 導航指南</p>
          </div>
        </div>
        <span id="total-counter-badge" class="ehon-badge bg-yellow text-xs">
          第1郡｜29 處
        </span>
      </div>

      <!-- 區域切換頁籤 (第1郡 / Thảo Điền（舊第2郡） / Bình Thạnh) -->
      <nav aria-label="區域切換選單" class="grid grid-cols-2 sm:grid-cols-3 gap-2">
        <button
          id="tab-d1"
          type="button"
          data-district="d1"
          class="district-tab ehon-btn bg-coral py-2.5 px-3 text-sm sm:text-base"
          aria-selected="true"
        >
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 40 40" fill="none">
            <rect x="6" y="14" width="28" height="20" rx="3" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3"/>
            <path d="M13 14V10C13 7 27 7 27 10V14" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/>
            <circle cx="20" cy="24" r="4" fill="#F2A497" stroke="#3E3A39" stroke-width="2.5"/>
          </svg>
          <span>第1郡 (29)</span>
        </button>

        <button
          id="tab-td"
          type="button"
          data-district="td"
          class="district-tab ehon-btn bg-washi py-2.5 px-3 text-sm sm:text-base"
          aria-selected="false"
        >
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 40 40" fill="none">
            <path d="M20 34V18" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"/>
            <path d="M20 18C12 18 8 11 14 8C19 6 20 13 20 18Z" fill="#B9DAA5" stroke="#3E3A39" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M20 22C28 22 32 15 26 12C21 10 20 17 20 22Z" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2.5" stroke-linejoin="round"/>
          </svg>
          <span>Thảo Điền（舊第2郡）(23)</span>
        </button>

        <button
          id="tab-bt"
          type="button"
          data-district="bt"
          class="district-tab col-span-2 sm:col-span-1 ehon-btn bg-washi py-2 px-3 text-xs sm:text-sm"
          aria-selected="false"
        >
          <svg class="w-4 h-4 shrink-0" viewBox="0 0 40 40" fill="none">
            <polygon points="20,5 24,15 35,16 27,23 29,34 20,28 11,34 13,23 5,16 16,15" fill="#F6D27A" stroke="#3E3A39" stroke-width="2.5" stroke-linejoin="round"/>
          </svg>
          <span>Bình Thạnh 順遊 (2)</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- 主要內容容器 -->
  <main class="max-w-4xl mx-auto px-3 sm:px-4 pt-4">

    <!-- 目的地特色手繪風景橫幅 (隨分區切換地標、交通工具、風景) -->
    <section id="district-banner" class="ehon-box p-4 sm:p-5 mb-4 relative overflow-hidden">
      <div id="banner-inner" class="flex flex-col sm:flex-row items-center justify-between gap-4">
        <!-- 由 JS 動態渲染對應區域的介紹與大型手繪 SVG 風景 -->
      </div>
    </section>

    <!-- 搜尋與類型篩選列 -->
    <section aria-label="篩選與搜尋" class="mb-5 space-y-3">
      <div class="flex flex-col sm:flex-row gap-2.5">
        <!-- 關鍵字搜尋框 -->
        <div class="relative flex-1">
          <input
            id="search-input"
            type="search"
            placeholder="搜尋店名、河粉、蛋咖啡、皮件、Spa..."
            class="w-full bg-white border-[3px] border-[#3E3A39] rounded-full py-2.5 pl-10 pr-9 text-sm focus:outline-none shadow-[3px_3px_0px_#3E3A39]"
          >
          <svg class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="7" fill="#F6D27A" stroke="#3E3A39" stroke-width="2.5"/>
            <path d="M16.5 16.5L21 21" stroke="#3E3A39" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <button
            id="clear-search-btn"
            type="button"
            aria-label="清除搜尋"
            class="hidden absolute right-3 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-[#F2A497] border-2 border-[#3E3A39] text-xs font-bold flex items-center justify-center"
          >
            ✕
          </button>
        </div>
      </div>

      <!-- 分類快篩膠囊 -->
      <div id="category-filters" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 pt-0.5">
        <button type="button" data-cat="all" class="cat-pill ehon-btn bg-yellow px-3.5 py-1.5 text-xs shrink-0">全部類型</button>
        <button type="button" data-cat="food" class="cat-pill ehon-btn bg-washi px-3.5 py-1.5 text-xs shrink-0">🍜 餐飲美食</button>
        <button type="button" data-cat="cafe" class="cat-pill ehon-btn bg-washi px-3.5 py-1.5 text-xs shrink-0">☕ 咖啡・烘焙・小酌</button>
        <button type="button" data-cat="shop" class="cat-pill ehon-btn bg-washi px-3.5 py-1.5 text-xs shrink-0">🛍️ 選物・服飾・伴手禮</button>
        <button type="button" data-cat="relax" class="cat-pill ehon-btn bg-washi px-3.5 py-1.5 text-xs shrink-0">🌿 Spa・美容・服務</button>
      </div>
    </section>

    <!-- 景點卡片網格 (切換時觸發彈跳動畫) -->
    <section id="places-section" aria-live="polite">
      <div id="places-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 bounce-enter">
        <!-- 由 JS 渲染 54 個景點卡片 -->
      </div>

      <!-- 無符合結果提示 -->
      <div id="empty-state" class="hidden ehon-box p-8 text-center my-6">
        <div class="w-20 h-20 mx-auto mb-3 svg-float">
          <svg viewBox="0 0 80 80" fill="none">
            <circle cx="40" cy="40" r="30" fill="#A8D3E6" stroke="#3E3A39" stroke-width="3"/>
            <circle cx="30" cy="36" r="3.5" fill="#3E3A39"/>
            <circle cx="50" cy="36" r="3.5" fill="#3E3A39"/>
            <path d="M32 50C35 46 45 46 48 50" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="text-base font-bold mb-2">找不到符合條件的地點耶</p>
        <p class="text-xs opacity-80 mb-4">試試看切換其他區域頁籤，或清除搜尋關鍵字吧！</p>
        <button id="reset-filter-btn" type="button" class="ehon-btn bg-yellow px-5 py-2 text-sm">
          重設所有篩選
        </button>
      </div>
    </section>

  </main>

  <!-- 底部繪本風裝飾頁尾 -->
  <footer class="max-w-4xl mx-auto px-4 mt-10">
    <div class="ehon-box p-4 bg-washi flex flex-col sm:flex-row items-center justify-between gap-3 text-xs">
      <div class="flex items-center gap-3">
        <!-- 摩托車手繪 SVG -->
        <svg class="w-10 h-10 svg-scoot shrink-0" viewBox="0 0 64 64" fill="none">
          <circle cx="16" cy="46" r="8" fill="#3E3A39"/>
          <circle cx="16" cy="46" r="4" fill="#FFFCF6"/>
          <circle cx="48" cy="46" r="8" fill="#3E3A39"/>
          <circle cx="48" cy="46" r="4" fill="#FFFCF6"/>
          <path d="M12 44C12 34 22 32 32 32H44L48 20H38" fill="#F2A497" stroke="#3E3A39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 32V26H34V32" fill="#F6D27A" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="50" cy="22" r="4" fill="#F6D27A" stroke="#3E3A39" stroke-width="2.5"/>
        </svg>
        <div>
          <p class="font-bold text-sm">胡志明市散步地圖冊 (Ho Chi Minh City Guide)</p>
          <p class="opacity-80">收錄第1郡中心 29 處、Thảo Điền（舊第2郡）23 處、Bình Thạnh 2 處，共 54 個地點</p>
        </div>
      </div>
      <button id="back-to-top-btn" type="button" class="ehon-btn bg-green px-4 py-2 text-xs shrink-0">
        ↑ 回到頂端
      </button>
    </div>
  </footer>

    // 狀態管理
    let currentDistrict = "d1";
    let currentCat = "all";
    let searchQuery = "";

    // DOM 元素
    const bannerInner = document.getElementById("banner-inner");
    const placesGrid = document.getElementById("places-grid");
    const emptyState = document.getElementById("empty-state");
    const totalCounterBadge = document.getElementById("total-counter-badge");
    const searchInput = document.getElementById("search-input");
    const clearSearchBtn = document.getElementById("clear-search-btn");
    const resetFilterBtn = document.getElementById("reset-filter-btn");
    const backToTopBtn = document.getElementById("back-to-top-btn");
    const districtTabs = document.querySelectorAll(".district-tab");
    const catPills = document.querySelectorAll(".cat-pill");

    // 渲染橫幅
    function renderBanner() {
      const info = DISTRICT_BANNERS[currentDistrict];
      const extraBtnHtml = info.extraLink
        ? `<a href="${info.extraLink.url}" target="_blank" rel="noopener noreferrer" class="ehon-btn bg-yellow px-3.5 py-1.5 text-xs mt-2.5">
             📖 ${info.extraLink.label} ↗
           </a>`
        : "";

      bannerInner.innerHTML = `
        <div class="flex-1 text-left">
          <div class="inline-block ehon-badge ${info.badgeColor} mb-2">
            📍 區域散步指南
          </div>
          <h2 class="text-xl sm:text-2xl font-bold leading-snug mb-1">${info.title}</h2>
          <p class="text-xs sm:text-sm opacity-85 leading-relaxed">${info.subtitle}</p>
          ${extraBtnHtml}
        </div>
        <div class="flex items-center justify-center">
          ${info.svg}
        </div>
      `;
    }

    // 觸發彈跳動畫
    function triggerBounce(el, className) {
      el.classList.remove(className);
      void el.offsetWidth;
      el.classList.add(className);
    }

    // 渲染地點卡片
    function renderPlaces(withBounce = false) {
      const q = searchQuery.trim().toLowerCase();

      const filtered = PLACES.filter((item) => {
        const matchDistrict = item.district === currentDistrict;
        const matchCat = currentCat === "all" || item.categoryGroup === currentCat;
        const matchQuery = !q ||
          item.name.toLowerCase().includes(q) ||
          item.tag.toLowerCase().includes(q) ||
          item.desc.toLowerCase().includes(q);
        return matchDistrict && matchCat && matchQuery;
      });

      const districtLabelMap = {
        d1: "第1郡",
        td: "Thảo Điền",
        bt: "Bình Thạnh"
      };
      totalCounterBadge.textContent = `${districtLabelMap[currentDistrict]}｜顯示 ${filtered.length} 處`;

      if (filtered.length === 0) {
        placesGrid.classList.add("hidden");
        emptyState.classList.remove("hidden");
        return;
      }

      emptyState.classList.add("hidden");
      placesGrid.classList.remove("hidden");

      placesGrid.innerHTML = filtered.map((place) => {
        const svgMarkup = SVG_ICONS[place.icon] || SVG_ICONS.gift;
        const buttonsHtml = place.links.map((lnk) => {
          const btnBg = lnk.primary ? "bg-yellow" : "bg-washi";
          const iconPin = lnk.primary
            ? `<svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none">
                 <path d="M12 21C16 16.5 19 13 19 9C19 5.13 15.87 2 12 2C8.13 2 5 5.13 5 9C5 13 8 16.5 12 21Z" fill="#F2A497" stroke="#3E3A39" stroke-width="2.2"/>
                 <circle cx="12" cy="9" r="2.5" fill="#FFFCF6" stroke="#3E3A39" stroke-width="2"/>
               </svg>`
            : `<svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none">
                 <path d="M10 6H6V18H18V14M14 4H20M20 4V10M20 4L10 14" stroke="#3E3A39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
               </svg>`;
          return `
            <a
              href="${lnk.url}"
              target="_blank"
              rel="noopener noreferrer"
              class="ehon-btn ${btnBg} px-3.5 py-2 text-xs sm:text-sm"
            >
              ${iconPin}
              <span>${lnk.label}</span>
            </a>
          `;
        }).join("");

        return `
          <article class="ehon-card p-4 flex flex-col justify-between gap-3">
            <div class="flex items-start gap-3.5">
              <!-- 手繪 SVG 插圖框 -->
              <div class="w-16 h-16 rounded-2xl border-[3px] border-[#3E3A39] ${place.color} flex items-center justify-center shrink-0">
                ${svgMarkup}
              </div>
              <div class="flex-1 min-w-0">
                <span class="ehon-badge ${place.color} mb-1.5">
                  ${place.tag}
                </span>
                <h3 class="text-base sm:text-lg font-bold leading-snug break-words">
                  ${place.name}
                </h3>
                <p class="text-xs sm:text-sm opacity-85 mt-1 leading-relaxed">
                  ${place.desc}
                </p>
              </div>
            </div>
            <div class="flex flex-wrap items-center gap-2 pt-2 border-t-2 border-dashed border-[#3E3A39]/30">
              ${buttonsHtml}
            </div>
          </article>
        `;
      }).join("");

      if (withBounce) {
        triggerBounce(placesGrid, "bounce-enter");
        triggerBounce( document.getElementById("district-banner"), "bounce-enter");
      }
    }

    // 切換區域頁籤事件
    districtTabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        const targetDistrict = tab.dataset.district;
        if (!targetDistrict) return;
        currentDistrict = targetDistrict;

        districtTabs.forEach((t) => {
          const isSelected = t.dataset.district === currentDistrict;
          t.setAttribute("aria-selected", isSelected ? "true" : "false");
          t.classList.remove("bg-coral", "bg-blue", "bg-green", "bg-washi");
          if (isSelected) {
            const activeBg = currentDistrict === "d1" ? "bg-coral" : (currentDistrict === "td" ? "bg-blue" : "bg-green");
            t.classList.add(activeBg);
            triggerBounce(t, "tab-active-pop");
          } else {
            t.classList.add("bg-washi");
          }
        });

        renderBanner();
        renderPlaces(true);
      });
    });

    // 切換分類膠囊事件
    catPills.forEach((pill) => {
      pill.addEventListener("click", () => {
        currentCat = pill.dataset.cat || "all";
        catPills.forEach((p) => {
          const isSelected = p.dataset.cat === currentCat;
          p.classList.remove("bg-yellow", "bg-washi");
          p.classList.add(isSelected ? "bg-yellow" : "bg-washi");
        });
        renderPlaces(true);
      });
    });

    // 搜尋框事件
    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      clearSearchBtn.classList.toggle("hidden", !searchQuery.trim());
      renderPlaces(false);
    });

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      searchQuery = "";
      clearSearchBtn.classList.add("hidden");
      renderPlaces(true);
    });

    resetFilterBtn.addEventListener("click", () => {
      searchInput.value = "";
      searchQuery = "";
      currentCat = "all";
      clearSearchBtn.classList.add("hidden");
      catPills.forEach((p) => {
        p.classList.remove("bg-yellow", "bg-washi");
        p.classList.add(p.dataset.cat === "all" ? "bg-yellow" : "bg-washi");
      });
      renderPlaces(true);
    });

    backToTopBtn.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // 初始化渲染
    renderBanner();
    renderPlaces(false);
  </script>
